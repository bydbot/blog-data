name: Update Bangumi Data

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Bangumi pipeline
        run: bash crawl/scripts/update-bgm.sh
        env:
          BGM_USER_ID: "588237"
          BGM_TOKEN: ${{ secrets.BGM_TOKEN }}

      # 时间线产物不再入库：直传 R2 桶 blog-bgm。站点经 Pages Functions 运行时读取，
      # 故时间线数据更新秒级生效、无需重建博客。
      # 需要 secrets：R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
      # 注意：全程不枚举桶——aws s3 sync / rm --recursive 依赖桶级 ListObjects，
      # 遇到仅对象级权限的令牌会 AccessDenied。上传用单对象显式 cp（PutObject），
      # 清理先 GetObject 读回远端 manifest 算出失效分页，再逐键 delete-object
      # （DeleteObject，对不存在的键返回成功，天然幂等）。
      - name: Upload timeline data to R2
        # 上传失败不阻断后续数据入库步骤：git 数据提交是迁移前就有的契约，
        # R2 短暂滞后只影响时间线新鲜度（站点仍可读旧数据），告警可见即可。
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          B="s3://blog-bgm"
          EP="--endpoint-url $R2_ENDPOINT"
          MAN=data/bgm-timeline/page-manifest.json

          echo "== 读回远端旧 manifest（GetObject，用于精确清理） =="
          if aws s3 cp "$B/bgm-timeline/page-manifest.json" /tmp/old-manifest.json $EP >/dev/null 2>&1; then
            echo "已取到旧 manifest"
          else
            echo "无旧 manifest（首次上传），跳过精确清理"
            : > /tmp/old-manifest.json
          fi

          echo "== 上传 manifest / subjects / 日历索引 =="
          aws s3 cp "$MAN" "$B/bgm-timeline/page-manifest.json" $EP --content-type "application/json; charset=utf-8"
          aws s3 cp data/bgm-timeline/subjects.json "$B/bgm-timeline/subjects.json" $EP --content-type "application/json; charset=utf-8"
          aws s3 cp data/bgm-timeline.json "$B/bgm-timeline.json" $EP --content-type "application/json; charset=utf-8"

          echo "== 上传三源分页（8 并发） =="
          shopt -s nullglob
          for src in anime game other; do
            for f in data/bgm-timeline/$src/page-*.json; do
              printf '%s\n' "${f#data/}"
            done
          done | xargs -r -P 8 -I{} aws s3 cp "data/{}" "$B/{}" $EP --content-type "application/json; charset=utf-8"

          echo "== 计算失效键 =="
          : > /tmp/stale-keys.txt
          # 分页连续 1..pageCount，旧 manifest 的 pageCount 即旧最大页号：
          # 旧页数 > 新页数的部分即失效分页（源整体移除时新页数取 0，整段清理）。
          # 历史遗留 all/ 已于 2026-10-03 一次性清扫完毕，无需再留固定区间兜底。
          if [ -s /tmp/old-manifest.json ]; then
            jq -r '.categories | to_entries[] | "\(.key) \(.value.pageCount)"' /tmp/old-manifest.json \
              | while read -r src pc; do
                  newPc=$(jq -r ".categories.${src}.pageCount // 0" "$MAN")
                  if [ "$pc" -gt "$newPc" ] 2>/dev/null; then
                    seq $((newPc + 1)) "$pc" \
                      | sed "s|^|bgm-timeline/$src/page-|; s|\$|.json|" >> /tmp/stale-keys.txt || true
                  fi
                done
          fi
          sort -u /tmp/stale-keys.txt -o /tmp/stale-keys.txt

          echo "== 删除 $(wc -l < /tmp/stale-keys.txt) 个失效键 =="
          # 清理失败不阻断：上传已成功，失效键最多让旧分页多留一天
          if ! xargs -r -P 16 -I{} aws s3api delete-object --bucket blog-bgm --key "{}" $EP < /tmp/stale-keys.txt; then
            echo "::warning::部分失效键删除失败（检查令牌 Object Write 权限），本次上传不受影响"
          fi
          echo "R2 同步完成"

      - name: Commit and push if changed + trigger blog build
        run: |
          git config user.name "bydbot"
          git config user.email "111557429+bydbot@users.noreply.github.com"
          git add -A crawl data
          if git diff --cached --quiet; then
            echo "无数据变更，跳过 push"
          else
            git commit -m "chore: auto update bangumi data $(date -u +%Y-%m-%d)"
            git push
            # 只有追番页数据（构建期读取）变化才需要重建；时间线已直传 R2。
            if git diff-tree --no-commit-id --name-only -r HEAD | grep -qx "data/bangumi-data.json"; then
              echo "追番页数据变化，触发博客构建"
              curl -sS -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}" -d '{}' || echo "build hook 调用失败"
            else
              echo "仅原始数据/增量状态变化，时间线已直传 R2，无需重建"
            fi
          fi