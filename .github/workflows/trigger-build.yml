name: Trigger Blog Build on Content Push

# 用户手动 push 博客内容（posts/spec/data/images）时触发 Cloudflare Pages 构建。
# 注意：cron 的自动 push（GITHUB_TOKEN）不会触发本 workflow（GitHub 防递归设计）；
# 追番页与时间线数据均已直传 R2、站点运行时读取，cron 更新数据不再需要重建，
# 故 update.yml 不再调用部署钩子。
# api/ 已移除：Bangumi 数据不再入库（直传 R2，运行时读取）。
on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "spec/**"
      - "data/**"
      - "images/**"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        run: |
          curl -sS -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}" -d '{}'